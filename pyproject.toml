[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "project"
version = "0.1.0"
description = "a"
requires-python = ">=3.10"
dependencies = [
    "polars",
    "pandas",
    "numpy",
    "scikit-learn",
    "lightgbm",
    "matplotlib",
    "seaborn",
    "pyarrow",
]

[project.optional-dependencies]
dev = [
    "jupyterlab",
    "ipykernel",
    "ruff",
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]